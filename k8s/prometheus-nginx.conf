# =========================================================
# prometheus.ergesanbaishou.com —— 外层 NGINX 反代配置
# (监控三件套·① 的"无端口"入口;配套 K8S 侧见同目录 prometheus-ingress.yaml)
#
# 链路(独立 controller 专属入口,同 harbor 32588 模式):
#   浏览器 http://prometheus.ergesanbaishou.com/     ← 无端口!外层 nginx 监听 80
#     → 本文件(外层 NGINX,TLS 可在此终止)
#     → 10.18.170.34:30990(ingress-prometheus-nginx-controller 专属入口)
#     → Ingress(prometheus-ingress.yaml,class=prometheus-nginx)按 Host 分流
#     → svc prometheus-server(monitoring):80 → Pod:9090
#
# ★ 端口说明(最终采用:独立 controller,端口隔离):
#   本集群三套 controller 各管一段(kubectl -n ingress-nginx get svc 可见):
#     ingress-nginx-controller            31588/30443  共享款(k8s-web 等)
#     ingress-harbor-nginx-controller     32588/31443  harbor 专属
#     ingress-prometheus-nginx-controller 30990/30490  ★ Prometheus 专属(本链路)
#   ★ 前提(必须先做,否则 30990 不通):
#     helm 装 ingress-prometheus-nginx(class=prometheus-nginx,http 固定 30990),
#     且 prometheus-ingress.yaml 的 ingressClassName 已指 prometheus-nginx
#     (完整命令见 k8s-monitor.html 第 04 章 5.5 节)
#   若要回共享方案:upstream 改回 31588,Ingress 的 class 改回 nginx 再 apply
#
# 部署位置:外层 NGINX 机器的 /etc/nginx/conf.d/prometheus.ergesanbaishou.com.conf
#   ★ 文件名必须以 .conf 结尾!nginx 只 include conf.d/*.conf,
#     无后缀文件静默不加载,nginx -t 也不报错,表现为"默认欢迎页"(血泪教训)
#
# 用法三步(在外层 NGINX 机器上):
#   1) scp 本文件到 /etc/nginx/conf.d/prometheus.ergesanbaishou.com.conf
#   2) nginx -t && nginx -s reload        # 改完必做,否则不生效
#   3) 验证: curl -s http://127.0.0.1/-/healthy -H "Host: prometheus.ergesanbaishou.com"
#      期望: Prometheus is Healthy.
#
# hosts 解析变化:走外层后,prometheus.ergesanbaishou.com 要解析到
#   ★外层 NGINX 所在机器的 IP★(不再直连节点端口)
# =========================================================

upstream prometheus_ergesanbaishou {
    server 10.18.170.34:30990;     # ★ Prometheus 专属 controller 入口(同 harbor 32588 模式);
    keepalive 32;                   #   回共享方案则改 :31588(controller 共享入口)
}

# ---------- 80 版(先用这个,内网可用) ----------
server {
    listen 80;
    server_name prometheus.ergesanbaishou.com;

    access_log /var/log/nginx/prometheus.access.log;
    error_log  /var/log/nginx/prometheus.error.log;

    location / {
        proxy_pass http://prometheus_ergesanbaishou;

        # ★★★ 灵魂行:透传 Host,Ingress 全靠它分流,丢了必 404 ★★★
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持(Prometheus UI 日志流/后续 Grafana live 也用得上)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;           # 大范围 PromQL 查询可能慢,放宽
        proxy_send_timeout 300s;
    }
}


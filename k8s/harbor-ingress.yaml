# Harbor 流量入口:外层 Nginx(80) → ingress-nginx NodePort(32588) → 本 Ingress 按 Host 分流
# /v2 /api /service /c → harbor-core(API);/ → harbor-portal(UI)
# 注:proxy-body-size "0" 不限制上传体积(镜像层大),ssl-redirect 关闭(外层暂走 HTTP)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  namespace: harbor
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: harbor.ergesanbaishou.com
      http:
        paths:
          - path: /v2
            pathType: Prefix
            backend:
              service: {name: harbor-core, port: {number: 80}}
          - path: /api/
            pathType: Prefix
            backend:
              service: {name: harbor-core, port: {number: 80}}
          - path: /service/
            pathType: Prefix
            backend:
              service: {name: harbor-core, port: {number: 80}}
          - path: /c/
            pathType: Prefix
            backend:
              service: {name: harbor-core, port: {number: 80}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: harbor-portal, port: {number: 80}}
